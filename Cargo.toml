[workspace]
resolver = "2"
members = [
    "crates/nib-core",
    "crates/nib-serde",
    "crates/nib-storage",
    "crates/nib-capture",
    "crates/nib-collab",
    "crates/nib-grid",
    "crates/nib-gui",
    "crates/nib-tui",
    "crates/nib-ui",
]
# The marketing site is a standalone package with its own lockfile, built via
# --manifest-path. It requires Rust 1.95; keeping it out of the workspace stops
# that floor from propagating to everything else.
exclude = ["apps/site"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
authors = ["Doug Lance"]
repository = "https://github.com/douglance/nib"
homepage = "https://nib.doug-lance.workers.dev"
license = "Apache-2.0"

[workspace.dependencies]
# Workspace crates
nib-core = { path = "crates/nib-core" }
nib-serde = { path = "crates/nib-serde" }
nib-storage = { path = "crates/nib-storage" }
nib-capture = { path = "crates/nib-capture" }
nib-collab = { path = "crates/nib-collab" }
nib-grid = { path = "crates/nib-grid" }
nib-gui = { path = "crates/nib-gui" }
nib-tui = { path = "crates/nib-tui" }
nib-ui = { path = "crates/nib-ui" }

# Shared external dependencies
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = "0.25"
ab_glyph = "0.2"
tokio = { version = "1.42", features = ["rt-multi-thread", "fs", "sync", "macros", "time"] }
tracing = "0.1"
ratatui = "0.29"
crossterm = "0.28"

# Root crate dependencies
gpui = "0.2"
clap = { version = "4.5", features = ["derive", "env", "string"] }
incurs = { git = "https://github.com/douglance/incurs.git", rev = "3f96829c7fa442572c4c3fc4040798459e5d4b9f", features = ["mcp"] }
incurs-codemode = { git = "https://github.com/douglance/incurs.git", rev = "3f96829c7fa442572c4c3fc4040798459e5d4b9f" }
incurs-codemode-local = { git = "https://github.com/douglance/incurs.git", rev = "3f96829c7fa442572c4c3fc4040798459e5d4b9f" }
incurs-codemode-mcp = { git = "https://github.com/douglance/incurs.git", rev = "3f96829c7fa442572c4c3fc4040798459e5d4b9f" }
async-trait = "0.1"
async-stream = "0.3"
screenshots = "0.8"
arboard = { version = "3.4", features = ["image-data"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "7.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
ocrs = "0.9"
rten = "0.13"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
interprocess = { version = "2.2", features = ["tokio"] }
parking_lot = "0.12"
dashmap = "6.0"
crossbeam-channel = "0.5"
rstar = "0.12"
lru = "0.12"
bincode = "1.3"
rayon = "1.10"
schemars = "1.0"
libc = "0.2"
xcap = "0.8"
ureq = { version = "2.12", features = ["json"] }

# Dev dependencies
tempfile = "3.14"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1.41", features = ["yaml"] }

[package]
name = "nib"
version = "0.3.1"
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Fast, native screenshot annotation tool with semantic visual communication"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords = ["screenshot", "annotation", "image", "tool"]
categories = ["graphics", "gui", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "nib"
path = "src/main.rs"

[lib]
name = "nib"
path = "src/lib.rs"

[dependencies]
# Workspace crates
nib-core.workspace = true
nib-serde.workspace = true
nib-storage.workspace = true
nib-capture.workspace = true
nib-collab.workspace = true
nib-grid.workspace = true
nib-gui = { workspace = true, optional = true }
nib-tui.workspace = true
nib-ui.workspace = true

# GUI Framework
gpui.workspace = true

# CLI parsing
clap.workspace = true
incurs.workspace = true
incurs-codemode.workspace = true
incurs-codemode-local.workspace = true
incurs-codemode-mcp.workspace = true
async-trait.workspace = true
async-stream.workspace = true

# Image processing
image.workspace = true
imageproc.workspace = true

# Screen capture
screenshots.workspace = true

# Clipboard
arboard.workspace = true

# Local database for search index
rusqlite.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

# Cryptographic hashing
sha2.workspace = true

# Async runtime
tokio.workspace = true

# File watching
notify.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Directories (config, cache paths)
dirs.workspace = true

# Time handling
chrono.workspace = true

# Unique IDs
uuid.workspace = true

# Config file parsing (nib generate / nib judge command seam)
toml = "0.8"

# OCR (text detection and recognition) - feature-gated
ocrs = { workspace = true, optional = true }
rten = { workspace = true, optional = true }

# Collaboration (real-time sync between CLI and GUI)
tokio-util.workspace = true
bytes.workspace = true
interprocess.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
crossbeam-channel.workspace = true

# Tiled capture system
rstar.workspace = true
lru.workspace = true
bincode.workspace = true
rayon.workspace = true

schemars.workspace = true

# Window capture
xcap.workspace = true
ureq.workspace = true

# Platform-specific utilities
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
criterion.workspace = true
insta.workspace = true

[features]
default = ["gui", "ocr"]
gui = ["dep:nib-gui"]
ocr = ["dep:ocrs", "dep:rten"]

[profile.release]
lto = "thin"
codegen-units = 1
