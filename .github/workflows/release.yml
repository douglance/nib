name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-13
            name: nib-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            name: nib-macos-aarch64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            name: nib-linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: nib-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-composite0-dev libxcb-damage0-dev libxcb-dpms0-dev libxcb-dri2-0-dev \
            libxcb-dri3-dev libxcb-glx0-dev libxcb-present-dev libxcb-randr0-dev \
            libxcb-record0-dev libxcb-res0-dev libxcb-screensaver0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xf86dri0-dev libxcb-xinerama0-dev libxcb-xinput-dev \
            libxcb-xkb-dev libxcb-xrm-dev libxcb-xtest0-dev libxcb-xv0-dev libxcb-xvmc0-dev \
            libxcb-cursor-dev libxcb-ewmh-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-render-util0-dev libxcb-util-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libssl-dev pkg-config \
            libdbus-1-dev libpipewire-0.3-dev \
            libfreetype6-dev libfontconfig1-dev \
            libwayland-dev libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libegl1-mesa-dev libgles2-mesa-dev libgbm-dev \
            libvulkan-dev \
            clang mold

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.name }}.tar.gz nib
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.name }}.zip nib.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
