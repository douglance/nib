name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  open-core-boundary:
    name: Open-core boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-open-core-boundary.mjs
      - run: npm test
        working-directory: npm

  typescript-packages:
    name: TypeScript - ${{ matrix.directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - apps/cloudflare
          - packages/protocol
          - packages/sdk
          - packages/playwright
          - packages/cypress
          - packages/delivery-adapters
          - integrations/github-action
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: npm run check --if-present
        working-directory: ${{ matrix.directory }}
      - run: npm run typecheck --if-present
        working-directory: ${{ matrix.directory }}
      - run: npm test --if-present
        working-directory: ${{ matrix.directory }}

  public-site:
    name: Public site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path apps/site/Cargo.toml
      - run: cargo run --manifest-path apps/site/Cargo.toml -- --export "$RUNNER_TEMP/nib-site"

  check:
    name: Check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-features

  test:
    name: Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-features -- -D warnings

  build-platforms:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-composite0-dev libxcb-damage0-dev libxcb-dpms0-dev libxcb-dri2-0-dev \
            libxcb-dri3-dev libxcb-glx0-dev libxcb-present-dev libxcb-randr0-dev \
            libxcb-record0-dev libxcb-res0-dev libxcb-screensaver0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xf86dri0-dev libxcb-xinerama0-dev libxcb-xinput-dev \
            libxcb-xkb-dev libxcb-xrm-dev libxcb-xtest0-dev libxcb-xv0-dev libxcb-xvmc0-dev \
            libxcb-cursor-dev libxcb-ewmh-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-render-util0-dev libxcb-util-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libssl-dev pkg-config \
            libdbus-1-dev libpipewire-0.3-dev \
            libfreetype6-dev libfontconfig1-dev \
            libwayland-dev libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libegl1-mesa-dev libgles2-mesa-dev libgbm-dev \
            libvulkan-dev \
            clang mold

      - name: Build
        run: cargo build --release
