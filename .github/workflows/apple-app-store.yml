name: Apple App Store Build 2

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Apple platform to archive and upload
        required: true
        default: both
        type: choice
        options:
          - both
          - ios
          - macos
  push:
    branches:
      - agent/prod-launch-20260811

permissions:
  contents: read

concurrency:
  group: apple-app-store-build-2
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload ${{ inputs.platform || 'both' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: 2AS3V73632
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      PLATFORM: ${{ inputs.platform || 'both' }}

    steps:
      - uses: actions/checkout@v4

      - name: Select production Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install temporary signing credentials
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/nib-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          P12_PATH="$RUNNER_TEMP/nib-distribution.p12"
          ASC_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          ASC_KEY_PATH="$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          printf '%s' "$DISTRIBUTION_P12_BASE64" | base64 --decode > "$P12_PATH"
          mkdir -p "$ASC_KEY_DIR"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Write App Store export options
        run: |
          cat > "$RUNNER_TEMP/AppStoreExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>2AS3V73632</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Archive and upload iOS, iPadOS, watchOS, and visionOS-compatible app
        if: env.PLATFORM == 'both' || env.PLATFORM == 'ios'
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/portal/mobile/Nib/Nib.xcodeproj \
            -scheme Nib \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Nib-iOS-build2.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Nib-iOS-build2.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/AppStoreExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/Nib-iOS-export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Archive and upload macOS app
        if: env.PLATFORM == 'both' || env.PLATFORM == 'macos'
        run: |
          set -euo pipefail
          cargo build --release --all-features --bin nib

          xcodebuild \
            -project apps/portal/mobile/Nib/Nib.xcodeproj \
            -scheme NibMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Nib-macOS-build2.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Nib-macOS-build2.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/AppStoreExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/Nib-macOS-export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
