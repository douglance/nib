[package]
name = "nib-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "GPUI-based graphical editor for Nib"
authors.workspace = true
repository.workspace = true
license-file.workspace = true

[dependencies]
# Workspace crates
nib-core.workspace = true
nib-serde.workspace = true
nib-storage.workspace = true
nib-collab.workspace = true

# GUI framework
gpui.workspace = true

# Image processing
image.workspace = true
arboard.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# IDs and time
uuid.workspace = true
chrono.workspace = true

# Logging
tracing.workspace = true

# Async
tokio.workspace = true

# Other
anyhow.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSRunningApplication", "NSWindow"] }

[dev-dependencies]
tempfile.workspace = true
