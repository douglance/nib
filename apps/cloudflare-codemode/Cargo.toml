[package]
name = "nib-codemode-global"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/douglance/nib"
homepage = "https://nibtool.com"

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
incurs = { git = "https://github.com/douglance/incurs.git", rev = "73be3e6356bbb26dc8ddc6fedb58a7f2b5c9e756", default-features = false }
incurs-codemode = { git = "https://github.com/douglance/incurs.git", rev = "73be3e6356bbb26dc8ddc6fedb58a7f2b5c9e756" }
incurs-codemode-cloudflare = { git = "https://github.com/douglance/incurs.git", rev = "73be3e6356bbb26dc8ddc6fedb58a7f2b5c9e756" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
send_wrapper = { version = "0.6", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = "0.8.5"

[workspace]
