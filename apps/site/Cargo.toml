[package]
name = "nib-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
repository = "https://github.com/douglance/nib"
homepage = "https://nib.doug-lance.workers.dev"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
http = "1.3"
topcoat = { git = "https://github.com/tokio-rs/topcoat", rev = "f267417e28b4730aee9962aa935f1b1d3837b6b7", default-features = false, features = ["asset", "router", "runtime", "view"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8.5", features = ["http"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
