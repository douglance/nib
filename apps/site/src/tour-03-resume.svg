<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Nib returns an approved decision to the agent</title>
  <desc id="desc">An approved structured decision flows back to the coding agent, which resumes deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b0f"/><stop offset="1" stop-color="#151b24"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="96" y="104" fill="#d8ff63" font-family="ui-monospace, monospace" font-size="22" font-weight="700" letter-spacing="3">03 / AGENT RESUMES</text>
  <text x="96" y="185" fill="#f6f8fb" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="760" letter-spacing="-3">Decision in. Work continues.</text>

  <g transform="translate(96 288)">
    <rect width="480" height="362" rx="34" fill="#11151b" stroke="#465264" stroke-width="2"/>
    <circle cx="240" cy="112" r="66" fill="#d8ff63" filter="url(#glow)"/>
    <path d="m211 112 21 21 42-51" fill="none" stroke="#182000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="240" y="216" text-anchor="middle" fill="#f6f8fb" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="760">Approved</text>
    <text x="240" y="257" text-anchor="middle" fill="#9aa6b5" font-family="Inter, system-ui, sans-serif" font-size="20">Alice · 3m 42s</text>
    <rect x="70" y="294" width="340" height="2" fill="#303a48"/>
    <text x="240" y="330" text-anchor="middle" fill="#d8ff63" font-family="ui-monospace, monospace" font-size="16" letter-spacing="2">DECISION.APPROVED</text>
  </g>

  <path d="M602 469h190" fill="none" stroke="#d8ff63" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="m776 453 20 16-20 16" fill="none" stroke="#d8ff63" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(824 288)">
    <rect width="520" height="362" rx="30" fill="#0d1117" stroke="#364150" stroke-width="2"/>
    <circle cx="34" cy="34" r="7" fill="#ff6b6b"/><circle cx="58" cy="34" r="7" fill="#ffd166"/><circle cx="82" cy="34" r="7" fill="#7bd88f"/>
    <text x="32" y="94" fill="#778394" font-family="ui-monospace, monospace" font-size="18">agent / checkout</text>
    <g fill="#f6f8fb" font-family="ui-monospace, monospace" font-size="20">
      <text x="32" y="148"><tspan fill="#d8ff63">✓</tspan> approval received</text>
      <text x="32" y="192"><tspan fill="#81a7ff">→</tspan> merging revision</text>
      <text x="32" y="236"><tspan fill="#81a7ff">→</tspan> deploying checkout</text>
    </g>
    <rect x="32" y="282" width="456" height="52" rx="15" fill="#151b24"/>
    <rect x="32" y="282" width="402" height="52" rx="15" fill="#d8ff63"/>
    <text x="260" y="316" text-anchor="middle" fill="#182000" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="760">Shipping...</text>
  </g>

  <path d="M1110 694v74H330v-74" fill="none" stroke="#d8ff63" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <path d="m314 710 16-20 16 20" fill="none" stroke="#d8ff63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="720" y="812" text-anchor="middle" fill="#9aa6b5" font-family="Inter, system-ui, sans-serif" font-size="20">Human judgment closes the loop.</text>
  <g transform="translate(666 850)"><circle cx="0" cy="0" r="7" fill="#3b4552"/><circle cx="26" cy="0" r="7" fill="#3b4552"/><circle cx="52" cy="0" r="7" fill="#d8ff63"/></g>
</svg>
