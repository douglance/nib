<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">An AI agent creates a Nib review request</title>
  <desc id="desc">Code and three evidence artifacts flow into one review request.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b0f"/><stop offset="1" stop-color="#151b24"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="96" y="104" fill="#d8ff63" font-family="ui-monospace, monospace" font-size="22" font-weight="700" letter-spacing="3">01 / AGENT ASKS</text>
  <text x="96" y="185" fill="#f6f8fb" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="760" letter-spacing="-3">Checkout update ready.</text>

  <g transform="translate(96 270)">
    <rect width="500" height="430" rx="30" fill="#0d1117" stroke="#364150" stroke-width="2"/>
    <circle cx="34" cy="34" r="7" fill="#ff6b6b"/><circle cx="58" cy="34" r="7" fill="#ffd166"/><circle cx="82" cy="34" r="7" fill="#7bd88f"/>
    <text x="32" y="94" fill="#778394" font-family="ui-monospace, monospace" font-size="18">agent / checkout</text>
    <g fill="none" stroke-linecap="round" stroke-width="13">
      <path d="M34 144h196" stroke="#e8edf3"/><path d="M252 144h102" stroke="#d8ff63"/>
      <path d="M34 184h76" stroke="#81a7ff"/><path d="M132 184h282" stroke="#657080"/>
      <path d="M34 224h132" stroke="#657080"/><path d="M188 224h188" stroke="#e8edf3"/>
      <path d="M34 264h238" stroke="#d8ff63"/><path d="M294 264h104" stroke="#657080"/>
    </g>
    <rect x="32" y="320" width="436" height="76" rx="16" fill="#151b24"/>
    <circle cx="70" cy="358" r="14" fill="#d8ff63"/>
    <path d="m63 358 5 5 10-12" fill="none" stroke="#182000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="102" y="366" fill="#f6f8fb" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="650">Tests passed</text>
  </g>

  <path d="M624 485h116" fill="none" stroke="#d8ff63" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="m724 469 20 16-20 16" fill="none" stroke="#d8ff63" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(776 250)">
    <rect width="568" height="500" rx="34" fill="#11151b" stroke="#465264" stroke-width="2"/>
    <text x="34" y="56" fill="#f6f8fb" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="760">nib<tspan fill="#d8ff63">.</tspan></text>
    <text x="34" y="112" fill="#9aa6b5" font-family="ui-monospace, monospace" font-size="17" letter-spacing="2">REVIEW REQUEST</text>
    <text x="34" y="160" fill="#f6f8fb" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700">Approve checkout redesign?</text>
    <g transform="translate(34 208)">
      <rect width="152" height="174" rx="20" fill="#181f29" stroke="#303a48"/>
      <rect x="18" y="20" width="116" height="86" rx="11" fill="#242d38"/>
      <path d="M35 89 60 60l22 22 15-17 20 24" fill="none" stroke="#d8ff63" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="146" fill="#f6f8fb" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650">Image</text>
    </g>
    <g transform="translate(208 208)">
      <rect width="152" height="174" rx="20" fill="#181f29" stroke="#303a48"/>
      <rect x="18" y="20" width="116" height="86" rx="11" fill="#242d38"/>
      <circle cx="76" cy="63" r="25" fill="#d8ff63"/><path d="m70 50 20 13-20 13z" fill="#182000"/>
      <text x="18" y="146" fill="#f6f8fb" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650">Video</text>
    </g>
    <g transform="translate(382 208)">
      <rect width="152" height="174" rx="20" fill="#181f29" stroke="#303a48"/>
      <g stroke-linecap="round" stroke-width="7"><path d="M22 46h80" stroke="#ff837a"/><path d="M22 72h108" stroke="#7bd88f"/><path d="M22 98h69" stroke="#7bd88f"/></g>
      <text x="18" y="146" fill="#f6f8fb" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650">Diff</text>
    </g>
    <rect x="34" y="414" width="500" height="52" rx="15" fill="#d8ff63"/>
    <text x="284" y="448" text-anchor="middle" fill="#182000" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="760">Send for review</text>
  </g>

  <g transform="translate(666 835)"><circle cx="0" cy="0" r="7" fill="#d8ff63"/><circle cx="26" cy="0" r="7" fill="#3b4552"/><circle cx="52" cy="0" r="7" fill="#3b4552"/></g>
</svg>
