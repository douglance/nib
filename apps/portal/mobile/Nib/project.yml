name: Nib
options:
  bundleIdPrefix: com.douglance
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
    visionOS: "2.0"
    watchOS: "11.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 7
    MARKETING_VERSION: 0.3.1
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 2AS3V73632
  configs:
    Debug:
      APS_ENVIRONMENT: development
      NIB_APNS_ENVIRONMENT: sandbox
    Release:
      APS_ENVIRONMENT: production
      NIB_APNS_ENVIRONMENT: production
packages:
  NibKit:
    path: Packages/NibKit
targets:
  Nib:
    type: application
    platform: iOS
    sources:
      - path: Sources/NibModels.swift
      - path: Sources/NibClient.swift
      - path: Sources/NibAccountView.swift
      - path: Sources/NibApp.swift
      - path: Sources/NibNotificationActions.swift
      - path: Sources/NativeVisualReviewWorkspace.swift
      - path: Sources/NibDocumentReviewAdapter.swift
      - path: Sources/NibCloudLibraryAdapter.swift
      - path: Resources
      - path: SharedResources
    dependencies:
      - package: NibKit
        product: NibDomain
      - package: NibKit
        product: NibCloud
      - package: NibKit
        product: NibFeatures
      - package: NibKit
        product: NibDocument
      - package: NibKit
        product: NibNotifications
      - target: NibNotificationService
        embed: true
      - target: NibNotificationContent
        embed: true
      - target: NibWatch
        embed: true
    info:
      path: Nib-Info.plist
      properties:
        CFBundleDisplayName: Nib
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: Copyright 2026 Lance Ventures LLC. All rights reserved.
        NibAPNSEnvironment: $(NIB_APNS_ENVIRONMENT)
        CFBundleURLTypes:
          - CFBundleURLName: com.douglance.nib
            CFBundleURLSchemes:
              - nib
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Nib attaches photos to requests so agents can see what you see.
        NSPhotoLibraryUsageDescription: Nib attaches selected images to requests.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.douglance.nib
    entitlements:
      path: Nib.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - "applinks:nibtool.com"
  NibNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NibNotificationService.swift
    info:
      path: NibNotificationService-Info.plist
      properties:
        CFBundleDisplayName: Nib rich notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.douglance.nib.NotificationService
        SKIP_INSTALL: YES
  NibNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NibNotificationContentViewController.swift
      - path: ContentResources
    dependencies:
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
    info:
      path: NibNotificationContent-Info.plist
      properties:
        CFBundleDisplayName: Nib request actions
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionAttributes:
            UNNotificationExtensionCategory:
              - NIB_APPROVAL
              - NIB_CHOICE
              - NIB_TEXT
              - NIB_SHIP_HOLD_REVISE
              - NIB_APPROVE_HOLD
              - NIB_APPROVE_REJECT
              - NIB_ALLOW_DENY
              - NIB_YES_NO
              - NIB_SHIP_HOLD
              - NIB_USE_REVISE
            UNNotificationExtensionDefaultContentHidden: false
            UNNotificationExtensionInitialContentSizeRatio: 0.21
            UNNotificationExtensionUserInteractionEnabled: true
          NSExtensionMainStoryboard: MainInterface
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.douglance.nib.NotificationContent
        SKIP_INSTALL: YES
  NibWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/NibModels.swift
      - path: Sources/NibClient.swift
      - path: Sources/NibAccountView.swift
      - path: Sources/NibWatchApp.swift
      - path: Sources/NibWatchCloudLibrary.swift
      - path: WatchResources
      - path: SharedResources
    dependencies:
      - package: NibKit
        product: NibDomain
      - package: NibKit
        product: NibCloud
      - package: NibKit
        product: NibNotifications
    info:
      path: NibWatch-Info.plist
      properties:
        CFBundleDisplayName: Nib
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NibAPNSEnvironment: $(NIB_APNS_ENVIRONMENT)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.douglance.nib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.douglance.nib.watchkitapp
    entitlements:
      path: NibWatch.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
  NibVision:
    type: application
    platform: visionOS
    sources:
      - path: Sources/NibModels.swift
      - path: Sources/NibClient.swift
      - path: Sources/NibAccountView.swift
      - path: Sources/NibApp.swift
      - path: Sources/NibNotificationActions.swift
      - path: Sources/NativeVisualReviewWorkspace.swift
      - path: Sources/NibDocumentReviewAdapter.swift
      - path: Sources/NibCloudLibraryAdapter.swift
      - path: Resources
      - path: SharedResources
    dependencies:
      - package: NibKit
        product: NibDomain
      - package: NibKit
        product: NibCloud
      - package: NibKit
        product: NibFeatures
      - package: NibKit
        product: NibDocument
      - package: NibKit
        product: NibNotifications
    info:
      path: NibVision-Info.plist
      properties:
        CFBundleDisplayName: Nib
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIcons:
          CFBundlePrimaryIcon: AppIcon
        ITSAppUsesNonExemptEncryption: false
        NibAPNSEnvironment: $(NIB_APNS_ENVIRONMENT)
        CFBundleURLTypes:
          - CFBundleURLName: com.douglance.nib
            CFBundleURLSchemes:
              - nib
        NSCameraUsageDescription: Nib attaches photos to requests so agents can see what you see.
        NSPhotoLibraryUsageDescription: Nib attaches selected images to requests.
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        MARKETING_VERSION: 1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.douglance.nib
    entitlements:
      path: Nib.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - "applinks:nibtool.com"
  NibMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/NibModels.swift
      - path: Sources/NibClient.swift
      - path: Sources/NibAccountView.swift
      - path: Sources/NibCloudLibraryAdapter.swift
      - path: MacSources
      - path: Resources
      - path: SharedResources
    dependencies:
      - package: NibKit
        product: NibDomain
      - package: NibKit
        product: NibCloud
      - package: NibKit
        product: NibFeatures
      - package: NibKit
        product: NibDocument
      - package: NibKit
        product: NibNotifications
      - sdk: UserNotifications.framework
      - sdk: ScreenCaptureKit.framework
    info:
      path: NibMac-Info.plist
      properties:
        CFBundleDisplayName: Nib
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        NibAPNSEnvironment: $(NIB_APNS_ENVIRONMENT)
        CFBundleURLTypes:
          - CFBundleURLName: com.douglance.nib.macos
            CFBundleURLSchemes:
              - nib
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        NIB_MAC_BUNDLE_IDENTIFIER: com.douglance.nib.macos
        PRODUCT_BUNDLE_IDENTIFIER: $(NIB_MAC_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Nib
    entitlements:
      path: NibMac.entitlements
      properties:
        com.apple.developer.aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
  NibMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacTests
    dependencies:
      - target: NibMac
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.douglance.nib.macos.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Nib.app/Contents/MacOS/Nib
schemes:
  Nib:
    build:
      targets:
        Nib: all
  NibVision:
    build:
      targets:
        NibVision: all
  NibWatch:
    build:
      targets:
        NibWatch: all
  NibMac:
    build:
      targets:
        NibMac: all
        NibMacTests:
          - test
    test:
      targets:
        - NibMacTests
      environmentVariables:
        NIB_TESTING: "1"
